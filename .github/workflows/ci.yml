name: Test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  linux:
    runs-on: ubuntu-latest
    name: Linux ${{ matrix.elixir }}, ${{ matrix.otp }}
    strategy:
      matrix:
        elixir: ["1.17.3"]
        otp: ["27.1.2"]
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v2
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
      # ort 2.0.0-rc.8 fails to build the CUDA/TensorRT variant on Rust 1.100+
      # (new cargo build-dir layout). Remove once ort is upgraded.
      - name: Pin Rust 1.99
        run: rustup toolchain install 1.99.1 --profile minimal && rustup default 1.99.1
      - name: Install dependencies
        run: mix deps.get
      - name: Compile and check warnings
        run: mix compile --warnings-as-errors
      - name: Check formatting
        run: mix format --check-formatted
      - name: Run tests
        run: mix test

  macos:
    runs-on: macos-latest
    name: macOS
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v2
      - name: Install
        run: |
          brew update
          brew install erlang@27 elixir
      - name: Install dependencies
        run: mix deps.get
      - name: Compile and check warnings
        run: mix compile --warnings-as-errors
      - name: Check formatting
        run: mix format --check-formatted
      - name: Run tests
        run: mix test
